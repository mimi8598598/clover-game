<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dodge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b0b16;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            background: #0b0b16;
        }

        /* Кнопка UPDATE (сдвинута ниже крестика Telegram) */
        .update-btn {
            position: absolute;
            top: 60px;
            left: 15px;
            background: rgba(15, 15, 30, 0.85);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 8px 14px;
            border-radius: 12px;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            z-index: 100;
        }

        .update-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Кнопка обновления -->
    <button class="update-btn" onclick="alert('Скоро здесь появится информация об обновлении!')">⏳ UPDATE</button>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Подгоняем холст под размеры экрана
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Игрок
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            radius: 18,
            color: '#00f3ff',
            speed: 6,
            targetX: canvas.width / 2
        };

        let obstacles = [];
        let score = 0;
        let isGameOver = false;
        let gameInterval;
        let obstacleTimer = 0;

        // Управление касанием / мышкой
        window.addEventListener('pointermove', (e) => {
            player.targetX = e.clientX;
        });

        window.addEventListener('pointerdown', (e) => {
            player.targetX = e.clientX;
            if (isGameOver) {
                resetGame();
            }
        });

        function spawnObstacle() {
            const radius = Math.random() * 15 + 15;
            const x = Math.random() * (canvas.width - radius * 2) + radius;
            const y = -radius;
            const speed = Math.random() * 3 + 3;
            const color = Math.random() > 0.5 ? '#ff007f' : '#b000ff';

            obstacles.push({ x, y, radius, speed, color });
        }

        function resetGame() {
            obstacles = [];
            score = 0;
            isGameOver = false;
            player.x = canvas.width / 2;
            player.targetX = canvas.width / 2;
            loop();
        }

        function update() {
            if (isGameOver) return;

            // Плавное движение игрока за пальцем/мышкой
            player.x += (player.targetX - player.x) * 0.2;

            // Ограничение в пределах экрана
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;

            // Спавн препятствий
            obstacleTimer++;
            if (obstacleTimer > 35) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            // Движение препятствий и проверка столкновений
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                // Проверка столкновения с игроком (коллизия кругов)
                const dx = player.x - obs.x;
                const dy = player.y - obs.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.radius + obs.radius) {
                    isGameOver = true;
                }

                // Удаление улетевших препятствий и начисление очков
                if (obs.y - obs.radius > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }
        }

        function draw() {
            // Очистка экрана
            ctx.fillStyle = '#0b0b16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Отрисовка игрока с неоновым свечением
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // Отрисовка препятствий
            for (let obs of obstacles) {
                ctx.shadowBlur = 12;
                ctx.shadowColor = obs.color;
                ctx.fillStyle = obs.color;
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0; // Сбрасываем свечение для текста

            // Вывод счета
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`Счет: ${score}`, 20, 120);

            // Экран Game Over
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff007f';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = '#fff';
                ctx.font = '18px sans-serif';
                ctx.fillText(`Ваш счет: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.fillStyle = '#00f3ff';
                ctx.fillText('Нажмите, чтобы начать заново', canvas.width / 2, canvas.height / 2 + 60);
            }
        }

        function loop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(loop);
            }
        }

        // Запуск игрового цикла
        loop();
    </script>
</body>
</html>
