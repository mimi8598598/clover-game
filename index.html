<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Cyber Runner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon-blue: #00f3ff; --neon-pink: #ff0055; --neon-green: #00ff66; --bg: #05050a; }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; touch-action: none; }
        
        .screen { display: none; height: 100vh; width: 100vw; position: relative; }
        .screen.on { display: block; }

        #game-canvas { display: block; width: 100%; height: 100%; }
        
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 10;
        }
        .badge {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 16px;
        }

        #overlay {
            position: absolute; inset: 0; background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(6px); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center;
        }
        #overlay h1 {
            font-size: 38px; margin: 0 0 10px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }
        .btn {
            background: linear-gradient(45deg, var(--neon-blue), #0066ff); color: #000;
            border: none; padding: 16px 36px; border-radius: 14px; font-weight: 800;
            font-size: 16px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4); margin-top: 15px; width: 100%; max-width: 280px;
        }
        .btn:active { transform: scale(0.96); }

        #toast {
            display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--neon-green); color: #000; padding: 10px 22px; border-radius: 50px;
            font-weight: bold; z-index: 999; box-shadow: 0 5px 20px rgba(0, 255, 102, 0.5);
        }

        .hint {
            position: absolute; bottom: 25px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.4); font-size: 13px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div id="scr-game" class="screen on">
        <div id="hud">
            <div class="badge" style="color: var(--neon-green);">💾 <span id="chips-hud">0</span></div>
            <div class="badge" style="color: var(--neon-blue);">🏆 <span id="best-hud">0</span></div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div class="hint">Тапни в любом месте, чтобы перепрыгнуть препятствие!</div>
        <div id="overlay">
            <h1 id="ov-title">CYBER RUNNER</h1>
            <p id="ov-sub" style="color: #aaa; margin-bottom: 20px;">Прыгай по платформам, уворачивайся от дронов и собирай дата-чипы!</p>
            <button class="btn" onclick="startGame()">ЗАПУСК</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        let state = JSON.parse(localStorage.getItem('cyber_runner_v1')) || {
            chips: 0, best: 0
        };

        function save() {
            localStorage.setItem('cyber_runner_v1', JSON.stringify(state));
            document.getElementById('chips-hud').innerText = state.chips.toLocaleString();
            document.getElementById('best-hud').innerText = state.best.toLocaleString();
        }

        function notify(txt) {
            const t = document.getElementById('toast');
            t.innerText = txt;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        let running = false;
        let score = 0;
        let gameSpeed = 6;
        let obstacles = [];
        let particles = [];

        let player = {
            x: 80,
            y: 0,
            w: 30,
            h: 40,
            vy: 0,
            jumpForce: -12,
            gravity: 0.6,
            grounded: false
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 120 - player.h;
        }
        window.addEventListener('resize', resize);
        resize();

        // Управление прыжком по тапу/клику
        window.addEventListener('pointerdown', (e) => {
            if (!running) return;
            // Игнорируем нажатия на элементы интерфейса если таковые будут
            if (e.target.closest('#hud')) return;
            
            if (player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
                createJumpParticles();
            }
        });

        function createJumpParticles() {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: player.x + player.w / 2,
                    y: player.y + player.h,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 2,
                    color: '#00f3ff',
                    life: 20
                });
            }
        }

        function startGame() {
            resize();
            document.getElementById('overlay').style.display = 'none';
            obstacles = [];
            particles = [];
            score = 0;
            gameSpeed = 6;
            player.y = canvas.height - 120 - player.h;
            player.vy = 0;
            player.grounded = true;
            running = true;
            loop();
        }

        function spawnObstacle() {
            let type = Math.random();
            let groundY = canvas.height - 120;
            
            if (type < 0.6) {
                // Красный кибер-блок на земле
                obstacles.push({
                    x: canvas.width + 50,
                    y: groundY - 35,
                    w: 30,
                    h: 35,
                    type: 'block',
                    color: '#ff0055'
                });
            } else {
                // Летающий дрон (нужно пропустить или вовремя рассчитать прыжок)
                obstacles.push({
                    x: canvas.width + 50,
                    y: groundY - 75 - Math.random() * 40,
                    w: 35,
                    h: 20,
                    type: 'drone',
                    color: '#ffd700'
                });
            }
        }

        let spawnTimer = 0;

        function update() {
            if (!running) return;

            score++;
            gameSpeed = 6 + Math.floor(score / 350); // Постепенное ускорение

            // Гравитация и прыжок игрока
            player.vy += player.gravity;
            player.y += player.vy;

            let groundY = canvas.height - 120;
            if (player.y >= groundY - player.h) {
                player.y = groundY - player.h;
                player.vy = 0;
                player.grounded = true;
            }

            // Спавн препятствий
            spawnTimer++;
            let spawnInterval = Math.max(50, 110 - Math.floor(score / 100));
            if (spawnTimer >= spawnInterval) {
                spawnObstacle();
                spawnTimer = 0;
            }

            // Движение препятствий
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Проверка столкновения (AABB)
                let collisionMargin = 6;
                if (
                    player.x + collisionMargin < obs.x + obs.w - collisionMargin &&
                    player.x + player.w - collisionMargin > obs.x + collisionMargin &&
                    player.y + collisionMargin < obs.y + obs.h - collisionMargin &&
                    player.y + player.h - collisionMargin > obs.y + collisionMargin
                ) {
                    // Конец игры
                    running = false;
                    if (score > state.best) {
                        state.best = score;
                    }
                    state.chips += Math.floor(score / 10);
                    save();

                    document.getElementById('ov-title').innerText = 'SYSTEM CRASH';
                    document.getElementById('ov-sub').innerText = `Дистанция: ${score} | Чипы: +${Math.floor(score / 10)} 💾\nРекорд: ${state.best}`;
                    document.getElementById('overlay').style.display = 'flex';
                    return;
                }

                // Удаление улетевших препятствий
                if (obs.x + obs.w < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Обновление частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            // Очистка экрана
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let groundY = canvas.height - 120;

            // Неоновый фон (линии сетки киберпространства)
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, groundY);
                ctx.stroke();
            }

            // Земля / кибер-дорога
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00f3ff';
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Заливка под дорогой
            ctx.fillStyle = 'rgba(0, 243, 255, 0.05)';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Отрисовка игрока (кибер-агент)
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f3ff';
            ctx.fillStyle = '#00f3ff';
            ctx.fillRect(player.x, player.y, player.w, player.h);
            
            // Внутренний элемент игрока (шлем/визор)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 15, player.y + 8, 10, 6);
            ctx.shadowBlur = 0;

            // Отрисовка препятствий
            for (let obs of obstacles) {
                ctx.shadowBlur = 12;
                ctx.shadowColor = obs.color;
                ctx.fillStyle = obs.color;
                
                if (obs.type === 'drone') {
                    // Отрисовка дрона в виде ромба
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.w/2, obs.y + obs.h/2, obs.w/2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                }
                ctx.shadowBlur = 0;
            }

            // Отрисовка частиц
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
            }

            // Текущий счет прямо на холсте
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`СЧЕТ: ${score}`, canvas.width - 20, 70);
        }

        function loop() {
            update();
            draw();
            if (running) {
                requestAnimationFrame(loop);
            }
        }

        save();
    </script>
</body>
</html>
