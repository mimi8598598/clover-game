<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dodge</title>
    <style>
        /* Стили игры (сюда можешь добавить свои стили) */
        body {
            margin: 0;
            background: #0b0b16;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* Кнопка на главном экране */
        .update-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 15, 30, 0.85);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 8px 14px;
            border-radius: 12px;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            z-index: 100;
        }

        /* Всплывающее окно (Модалка) */
        .update-modal {
            display: none; /* Скрыто по умолчанию */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .update-card {
            background: #14142b;
            border: 2px solid #ff007f;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
            font-family: sans-serif;
            color: white;
        }

        /* Баннер с ??? */
        .update-banner {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .update-date-badge {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #00f3ff;
        }

        .update-mystery {
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px #ff007f;
            letter-spacing: 4px;
        }

        .update-body {
            padding: 16px;
        }

        .update-timer {
            font-size: 22px;
            font-weight: bold;
            color: #00f3ff;
            margin: 10px 0;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        .notify-btn {
            width: 100%;
            padding: 10px;
            background: #ff007f;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }

        .notify-btn.subscribed {
            background: #28a745;
        }

        .close-modal {
            margin-top: 10px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Кнопка открытия -->
    <button class="update-btn" onclick="openUpdateModal()">⏳ UPDATE</button>

    <!-- Окно с таймером -->
    <div class="update-modal" id="updateModal">
        <div class="update-card">
            <div class="update-banner">
                <div class="update-date-badge" id="updateDateText">14 Ноя в 16:00 (GMT)</div>
                <div class="update-mystery">???</div>
            </div>
            <div class="update-body">
                <h3 style="margin: 0; font-size: 18px;">NEXT UPDATE!</h3>
                <p style="margin: 4px 0; font-size: 12px; color: #bbb;">Не пропусти выход новой версии</p>
                
                <!-- Живой таймер -->
                <div class="update-timer" id="countdownTimer">00д 00ч 00м 00с</div>
                
                <button class="notify-btn" id="notifyBtn" onclick="toggleNotify()">🔔 Notify Me</button>
                <button class="close-modal" onclick="closeUpdateModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        // 14 ноября 2026 года, 16:00 по времени Ирландии (GMT/UTC)
        const targetUpdateDate = Date.UTC(2026, 10, 14, 16, 0, 0);

        function openUpdateModal() {
            document.getElementById('updateModal').style.display = 'flex';
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').style.display = 'none';
        }

        function toggleNotify() {
            const btn = document.getElementById('notifyBtn');
            if (!btn.classList.contains('subscribed')) {
                btn.classList.add('subscribed');
                btn.innerText = '✅ Напоминание включено!';
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.showAlert('Мы уведомим тебя, как только выйдет обновление!');
                }
            }
        }

        function updateCountdown() {
            const now = Date.now();
            const distance = targetUpdateDate - now;

            if (distance <= 0) {
                document.getElementById('countdownTimer').innerText = "ОБНОВА ВЫШЛА! 🔥";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('countdownTimer').innerText = 
                `${days}д ${hours}ч ${minutes}м ${seconds}с`;
        }

        // Запускаем сразу при загрузке и обновляем каждую секунду
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
