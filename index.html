<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Project</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #00f2fe; --pink: #fe0979; --gold: #ffd700; --bg: #07070c; }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; touch-action: none; }
        
        .screen { display: none; height: 100vh; width: 100vw; position: relative; }
        .screen.on { display: block; }

        /* Игровой экран */
        #game-canvas { display: block; width: 100%; height: 100%; }
        
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 10;
        }
        .badge {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 16px;
        }

        /* Меню старта / проигрыша */
        #overlay {
            position: absolute; inset: 0; background: rgba(7, 7, 12, 0.85);
            backdrop-filter: blur(6px); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center;
        }
        #overlay h1 {
            font-size: 38px; margin: 0 0 10px;
            background: linear-gradient(45deg, var(--accent), var(--pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .btn {
            background: linear-gradient(45deg, var(--accent), #4facfe); color: #000;
            border: none; padding: 16px 36px; border-radius: 14px; font-weight: 800;
            font-size: 16px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4); margin-top: 15px; width: 100%; max-width: 280px;
        }
        .btn:active { transform: scale(0.96); }

        /* Магазин и настройки */
        .panel { padding: 20px 20px 90px; overflow-y: auto; height: 100%; }
        .card {
            background: #12121c; border: 1px solid #232336; padding: 18px;
            border-radius: 16px; margin-bottom: 14px; display: flex;
            justify-content: space-between; align-items: center;
        }
        .card-btn {
            background: var(--gold); color: #000; border: none; padding: 10px 16px;
            border-radius: 10px; font-weight: bold; cursor: pointer;
        }
        .card-btn:disabled { background: #333; color: #777; }
        .input-box {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #2d2d44;
            background: #0c0c14; color: white; font-size: 16px; outline: none; margin-bottom: 10px;
        }

        /* Нижняя панель */
        #nav {
            position: fixed; bottom: 0; width: 100%; display: flex;
            background: #0d0d15; border-top: 1px solid #1f1f2e; z-index: 100;
        }
        .nav-item {
            flex: 1; text-align: center; padding: 16px 5px; cursor: pointer;
            color: #666; font-size: 12px; font-weight: bold;
        }
        .nav-item.active { color: var(--accent); background: #141422; }

        #toast {
            display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--gold); color: #000; padding: 10px 22px; border-radius: 50px;
            font-weight: bold; z-index: 999; box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <!-- ЭКРАН 1: ИГРА -->
    <div id="scr-game" class="screen on">
        <div id="hud">
            <div class="badge" style="color: var(--gold);">💎 <span id="coins-hud">0</span></div>
            <div class="badge" style="color: var(--accent);">🏆 <span id="best-hud">0</span></div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="overlay">
            <h1 id="ov-title">NEON DODGE</h1>
            <p id="ov-sub" style="color: #aaa; margin-bottom: 20px;">Уворачивайся от красных блоков и собирай кристаллы!</p>
            <button class="btn" onclick="startGame()">ИГРАТЬ</button>
        </div>
    </div>

    <!-- ЭКРАН 2: АПГРЕЙДЫ -->
    <div id="scr-shop" class="screen">
        <div class="panel">
            <h2 style="text-align: center; color: var(--accent);">⚡ ПРОКАЧКА</h2>
            <div class="card">
                <div>
                    <b>🧲 Магнит кристаллов</b><br>
                    <small style="color: #888;">Уровень: <span id="lvl-mag">1</span></small>
                </div>
                <button class="card-btn" id="btn-mag" onclick="buyUpgrade('mag')">500 💎</button>
            </div>
            <div class="card">
                <div>
                    <b>🛡️ Энерго-щит</b><br>
                    <small style="color: #888;">Спасает от 1 удара (Ур. <span id="lvl-shd">0</span>)</small>
                </div>
                <button class="card-btn" id="btn-shd" onclick="buyUpgrade('shd')">1000 💎</button>
            </div>
            <div class="card">
                <div>
                    <b>🔥 Двойные кристаллы</b><br>
                    <small style="color: #888;">Множитель x<span id="lvl-mul">1</span></small>
                </div>
                <button class="card-btn" id="btn-mul" onclick="buyUpgrade('mul')">1500 💎</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: СЕКРЕТЫ -->
    <div id="scr-set" class="screen">
        <div class="panel">
            <h2 style="text-align: center; color: var(--gold);">⚙️ КОДЫ</h2>
            <div class="card" style="display: block;">
                <input type="text" id="cmd-input" class="input-box" placeholder="Введи секретный код...">
                <button class="btn" style="max-width: 100%; margin-top: 5px;" onclick="runCmd()">АКТИВИРОВАТЬ</button>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div id="nav">
        <div class="nav-item active" onclick="switchTab('scr-game', this)">🚀 ИГРА</div>
        <div class="nav-item" onclick="switchTab('scr-shop', this)">⚡ АПГРЕЙД</div>
        <div class="nav-item" onclick="switchTab('scr-set', this)">⚙️ КОДЫ</div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        let state = JSON.parse(localStorage.getItem('secret_game_v1')) || {
            coins: 0, best: 0, mag: 1, shd: 0, mul: 1
        };

        function save() {
            localStorage.setItem('secret_game_v1', JSON.stringify(state));
            document.getElementById('coins-hud').innerText = state.coins.toLocaleString();
            document.getElementById('best-hud').innerText = state.best.toLocaleString();
            document.getElementById('lvl-mag').innerText = state.mag;
            document.getElementById('lvl-shd').innerText = state.shd;
            document.getElementById('lvl-mul').innerText = state.mul;
            document.getElementById('btn-mag').innerText = (state.mag * 500) + ' 💎';
            document.getElementById('btn-shd').innerText = ((state.shd + 1) * 1000) + ' 💎';
            document.getElementById('btn-mul').innerText = (state.mul * 1500) + ' 💎';
        }

        function notify(txt) {
            const t = document.getElementById('toast');
            t.innerText = txt;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        function switchTab(id, el) {
            if (running) running = false;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
            document.getElementById(id).classList.add('on');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if (id === 'scr-game') document.getElementById('overlay').style.display = 'flex';
        }

        function buyUpgrade(type) {
            let cost = type === 'mag' ? state.mag * 500 : type === 'shd' ? (state.shd + 1) * 1000 : state.mul * 1500;
            if (state.coins < cost) return notify('❌ Не хватает кристаллов!');
            state.coins -= cost;
            state[type]++;
            save();
            notify('✅ Улучшено!');
        }

        function runCmd() {
            let val = document.getElementById('cmd-input').value.trim().toLowerCase();
            if (val === '/6633') {
                state.coins += 5000000;
                notify('👑 +5,000,000 💎');
            } else if (val.startsWith('/money')) {
                let n = parseInt(val.split(' ')[1]) || 10000;
                state.coins += n;
                notify('💎 +' + n.toLocaleString());
            } else if (val === '/reset') {
                localStorage.removeItem('secret_game_v1');
                location.reload();
            } else {
                notify('❓ Неизвестный код');
            }
            document.getElementById('cmd-input').value = '';
            save();
        }

        // Движок игры
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let running = false, score = 0, player = { x: 0, y: 0, r: 16, shield: false };
        let items = [], frame = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 50;
        }
        window.addEventListener('resize', resize);
        resize();

        function movePlayer(clientX) {
            player.x = Math.max(player.r, Math.min(canvas.width - player.r, clientX));
        }
        canvas.addEventListener('touchmove', e => { e.preventDefault(); movePlayer(e.touches[0].clientX); }, { passive: false });
        canvas.addEventListener('mousemove', e => { if (running) movePlayer(e.clientX); });

        function startGame() {
            resize();
            document.getElementById('overlay').style.display = 'none';
            player.x = canvas.width / 2;
            player.y = canvas.height - 90;
            player.shield = state.shd > 0;
            items = [];
            score = 0;
            frame = 0;
            running = true;
            loop();
        }

        function loop() {
            if (!running) return;
            ctx.fillStyle = 'rgba(7, 7, 12, 0.35)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            frame++;
            score++;
            let speed = 4 + Math.min(8, score / 400);

            if (frame % Math.max(12, 32 - Math.floor(score / 300)) === 0) {
                let isGem = Math.random() < 0.35;
                items.push({
                    x: Math.random() * (canvas.width - 30) + 15,
                    y: -20,
                    size: isGem ? 12 : 18 + Math.random() * 14,
                    type: isGem ? 'gem' : 'enemy',
                    vy: speed + Math.random() * 2
                });
            }

            // Игрок
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
            ctx.fillStyle = '#00f2fe';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f2fe';
            ctx.fill();
            ctx.shadowBlur = 0;

            if (player.shield) {
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.r + 7, 0, Math.PI * 2);
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Объекты
            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.vy;

                if (it.type === 'gem' && state.mag > 1) {
                    let dx = player.x - it.x, dy = player.y - it.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < 60 + state.mag * 35) {
                        it.x += (dx / dist) * 6;
                        it.y += (dy / dist) * 6;
                    }
                }

                if (it.type === 'gem') {
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.moveTo(it.x, it.y - it.size);
                    ctx.lineTo(it.x + it.size, it.y);
                    ctx.lineTo(it.x, it.y + it.size);
                    ctx.lineTo(it.x - it.size, it.y);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#fe0979';
                    ctx.fillRect(it.x - it.size / 2, it.y - it.size / 2, it.size, it.size);
                }

                let hit = Math.hypot(player.x - it.x, player.y - it.y) < player.r + it.size * 0.7;
                if (hit) {
                    if (it.type === 'gem') {
                        state.coins += 10 * state.mul;
                        save();
                        items.splice(i, 1);
                        continue;
                    } else {
                        if (player.shield) {
                            player.shield = false;
                            items.splice(i, 1);
                            notify('🛡️ Щит спас!');
                            continue;
                        } else {
                            running = false;
                            if (score > state.best) state.best = score;
                            save();
                            document.getElementById('ov-title').innerText = 'GAME OVER';
                            document.getElementById('ov-sub').innerText = `Счёт: ${score} | Рекорд: ${state.best}`;
                            document.getElementById('overlay').style.display = 'flex';
                            return;
                        }
                    }
                }
                if (it.y > canvas.height + 30) items.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }

        save();
    </script>
</body>
</html>
