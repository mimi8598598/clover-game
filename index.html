<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystery Project</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #080810; color: white; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <canvas id="cvs"></canvas>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let angle = 0;
        let radius = Math.min(canvas.width, canvas.height) * 0.35;
        let score = 0;
        let speed = 0.03;
        let targetAngle = Math.random() * Math.PI * 2;
        let particles = [];
        let isOver = false;

        window.addEventListener('pointerdown', () => {
            if (isOver) {
                resetGame();
                return;
            }

            let diff = Math.abs((angle - targetAngle + Math.PI) % (Math.PI * 2) - Math.PI);
            if (diff < 0.45) {
                score++;
                speed *= 1.07;
                createBurst(cx + Math.cos(targetAngle) * radius, cy + Math.sin(targetAngle) * radius, '#00ffcc');
                targetAngle = Math.random() * Math.PI * 2;
            } else {
                isOver = true;
                createBurst(cx, cy, '#ff0055');
            }
        });

        function createBurst(x, y, color) {
            for (let i = 0; i < 20; i++) {
                let a = Math.random() * Math.PI * 2;
                let spd = Math.random() * 6 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(a) * spd,
                    vy: Math.sin(a) * spd,
                    color: color,
                    life: 30
                });
            }
        }

        function resetGame() {
            score = 0;
            speed = 0.03;
            isOver = false;
            targetAngle = Math.random() * Math.PI * 2;
            particles = [];
        }

        function update() {
            cx = canvas.width / 2;
            cy = canvas.height / 2;
            radius = Math.min(canvas.width, canvas.height) * 0.35;

            if (!isOver) {
                angle += speed;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = '#080810';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Орбита
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Цель
            ctx.beginPath();
            ctx.arc(cx + Math.cos(targetAngle) * radius, cy + Math.sin(targetAngle) * radius, 16, 0, Math.PI * 2);
            ctx.fillStyle = '#00ffcc';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffcc';
            ctx.fill();
            ctx.shadowBlur = 0;

            // Бегающий элемент
            let px = cx + Math.cos(angle) * radius;
            let py = cy + Math.sin(angle) * radius;
            ctx.beginPath();
            ctx.arc(px, py, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';
            ctx.fill();
            ctx.shadowBlur = 0;

            // Частицы
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            }

            // Счет
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(score, cx, cy - 12);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.font = '14px sans-serif';
            ctx.fillText('ТАПНИ В ТАКТ', cx, cy + 20);

            if (isOver) {
                ctx.fillStyle = 'rgba(8, 8, 16, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff0055';
                ctx.font = 'bold 32px sans-serif';
                ctx.fillText('ПРОМАХ', cx, cy - 30);

                ctx.fillStyle = '#ffffff';
                ctx.font = '18px sans-serif';
                ctx.fillText(`Счет: ${score}`, cx, cy + 10);

                ctx.fillStyle = '#00ffcc';
                ctx.font = '15px sans-serif';
                ctx.fillText('Тапни, чтобы начать заново', cx, cy + 60);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
